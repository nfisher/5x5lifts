name: iOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26 (Swift 6.2)
        shell: bash
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -regex '.*/Xcode_26([.][0-9]+)*[.]app' -print | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Select an available iPhone Simulator
        shell: bash
        run: |
          DESTINATION="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print("platform=iOS Simulator,id=" + next(device["udid"] for runtime in data["devices"].values() for device in runtime if "iPhone" in device["name"]))')"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Build
        run: >-
          xcodebuild build
          -project FiveByFiveLifts.xcodeproj
          -scheme FiveByFiveLifts
          -destination "$DESTINATION"
          CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: >-
          xcodebuild test
          -project FiveByFiveLifts.xcodeproj
          -scheme FiveByFiveLifts
          -destination "$DESTINATION"
          CODE_SIGNING_ALLOWED=NO
